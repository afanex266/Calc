<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
body{font-family:sans-serif;background:#222;display:flex;justify-content:center;padding:20px}
.calc{width:100%;max-width:320px}
#display{background:#000;color:#fff;font-size:2.5rem;text-align:right;padding:20px;border-radius:12px;margin-bottom:10px;overflow:hidden}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{font-size:1.5rem;padding:20px;border:none;border-radius:12px;background:#444;color:#fff}
.op{background:#f90}
.w2{grid-column:span 2}
.w3{grid-column:span 3}
</style>
</head>
<body>
<div class="calc">
  <div id="display">0</div>
  <div class="keys">
    <button class="w2" onclick="clearAll()">C</button>
    <button class="op" onclick="chooseOp('/')">÷</button>
    <button class="op" onclick="chooseOp('*')">×</button>
    <button onclick="num('7')">7</button>
    <button onclick="num('8')">8</button>
    <button onclick="num('9')">9</button>
    <button class="op" onclick="chooseOp('-')">−</button>
    <button onclick="num('4')">4</button>
    <button onclick="num('5')">5</button>
    <button onclick="num('6')">6</button>
    <button class="op" onclick="chooseOp('+')">+</button>
    <button onclick="num('1')">1</button>
    <button onclick="num('2')">2</button>
    <button onclick="num('3')">3</button>
    <button class="op" onclick="calc()">=</button>
    <button class="w3" onclick="num('0')">0</button>
    <button onclick="dot()">.</button>
  </div>
</div>

<script>
let current = "0", prev = null, op = null, fresh = false;
const d = document.getElementById("display");

function show() { d.textContent = current; }

function num(n) {
  if (current === "0" || current === "Error" || fresh) {
    current = n;
    fresh = false;
  } else {
    current += n;
  }
  show();
}

function dot() {
  if (fresh || current === "Error") { current = "0"; fresh = false; }
  if (!current.includes(".")) current += ".";
  show();
}

function chooseOp(o) {
  if (op && !fresh) calc();
  prev = parseFloat(current);
  op = o;
  fresh = true;
}

function calc() {
  if (op === null) return;
  const b = parseFloat(current);
  let r;
  if (op === "+") r = prev + b;
  if (op === "-") r = prev - b;
  if (op === "*") r = prev * b;
  if (op === "/") r = prev / b;
  current = isFinite(r) ? String(Math.round(r * 1e10) / 1e10) : "Error";
  op = null;
  fresh = true;
  show();
}

function clearAll() {
  current = "0"; prev = null; op = null; fresh = false;
  show();
}
</script>
</body>
</html>
